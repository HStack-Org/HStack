[package]
name = "hstack-cli"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "hstack-cli"
path = "src/main.rs"

[dependencies]
hstack-agent = { path = "../hstack-agent" }
hstack-core = { path = "../hstack-core" }

tokio = { version = "1.0", features = ["full"] }
crossterm = { version = "0.27", features = ["event-stream"] }
ratatui = "0.30.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.3"
dirs = "5.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
